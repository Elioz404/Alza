<!doctype html>
<html lang="en" data-astryx-theme="stone" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <title>Alza — Plans that rise to 3D</title>
    <meta
      name="description"
      content="Draw floor plans in 2D, walk them in 3D, and let your AI agent co-edit the same live page through WebMCP. Built for the WebMCP Challenge."
    />
    <!--
      Astryx's anchored layers write their slide rules into a <style id="astryx-layer-slide-rules">
      unless an element with that id is already on the page. The rules ship in the bundled
      stylesheet instead (virtual:astryx-slide-rules.css, see vite.config.ts), because the CSP
      refuses a <style> element; this marker is what tells Astryx they are here.
    -->
    <meta id="astryx-layer-slide-rules" name="astryx-layer-slide-rules" content="bundled" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
